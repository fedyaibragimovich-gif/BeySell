<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="OldiSotdi — O'zbekistonda oldi-sotdi marketplace">
<meta name="theme-color" content="#0f1117">
<title>OldiSotdi — Marketplace</title>
<link rel="stylesheet" href="./style.css?v=30">
<script>
(function(){
  try { document.documentElement.dataset.theme=localStorage.getItem('buysell-theme')==='light'?'light':'dark'; }
  catch(e){ document.documentElement.dataset.theme='dark'; }
  window.__oldisotdiBootError=null;
  window.addEventListener('error',function(e){
    if(e.target && e.target.tagName==='SCRIPT') return;
    window.__oldisotdiBootError={message:e.message||'JavaScript xatosi',source:e.filename||'',line:e.lineno||0,col:e.colno||0};
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__oldisotdiBootError={message:String(e.reason?.message||e.reason||'Promise xatosi'),source:'unhandledrejection',line:0,col:0};
  });
})();
</script>
</head>
<body>
<div id="app"><main class="container"><div class="panel"><h2>OldiSotdi</h2><p id="bootStatus">Yuklanmoqda…</p></div></main></div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script>
(function(){
  const app=document.getElementById('app'), status=document.getElementById('bootStatus');
  const scripts=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    './app1.js?v=30','./app2.js?v=30','./app3.js?v=30','./app4.js?v=30','./app5.js?v=30','./app6.js?v=30'
  ];
  function fail(message){
    app.innerHTML='<main class="container"><div class="panel"><h2>OldiSotdi</h2><p>Ilovani ishga tushirishda xatolik yuz berdi.</p><pre style="white-space:pre-wrap;text-align:left;overflow:auto">'+String(message)+'</pre><button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div></main>';
  }
  function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Script yuklanmadi: '+src));document.body.appendChild(s);});}
  async function boot(){
    try{
      for(const src of scripts){ status.textContent='Yuklanmoqda…'; await Promise.race([load(src),new Promise((_,r)=>setTimeout(()=>r(new Error('Timeout: '+src)),12000))]); }
      if(typeof init!=='function') throw new Error('OldiSotdi init funksiyasi topilmadi');
      await init();
      setTimeout(()=>{
        const s=document.createElement('script');s.id='oldisotdi-translation';s.src='./app8.js?v=3';s.onerror=()=>console.warn('Translation layer failed to load');document.body.appendChild(s);
      },250);
    }catch(e){console.error('OldiSotdi bootstrap:',e);fail(e?.message||String(e));}
  }
  boot();
})();
</script>
</body>
</html>
