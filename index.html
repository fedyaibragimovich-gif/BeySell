<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="BuySell — O'zbekistonda oldi-sotdi marketplace">
<meta name="theme-color" content="#0f1117">
<title>BuySell — Marketplace</title>
<link rel="stylesheet" href="./style.css?v=25">
<script>
  try {
    const saved=localStorage.getItem('buysell-theme');
    document.documentElement.dataset.theme=saved==='light'?'light':'dark';
  } catch(e) { document.documentElement.dataset.theme='dark'; }
  window.__buySellBootError=null;
  window.addEventListener('error',function(e){
    window.__buySellBootError={message:e.message||'JavaScript xatosi',source:e.filename||'',line:e.lineno||0,col:e.colno||0};
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__buySellBootError={message:String(e.reason?.message||e.reason||'Promise xatosi'),source:'unhandledrejection',line:0,col:0};
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script src="./app1.js?v=25"></script>
<script src="./app2.js?v=25"></script>
<script src="./app3.js?v=25"></script>
<script src="./app4.js?v=25"></script>
<script src="./app5.js?v=25"></script>
<script src="./app6.js?v=25"></script>
<script>
(function(){
  function showError(message){
    const app=document.getElementById('app');
    if(!app || app.innerHTML.trim()) return;
    const e=window.__buySellBootError;
    const details=e ? '<pre style="white-space:pre-wrap;text-align:left;margin-top:12px;overflow:auto">'+String(e.message)+'\n'+String(e.source)+'\nline: '+e.line+' col: '+e.col+'</pre>' : '';
    app.innerHTML='<main class="container"><div class="panel"><h2>BuySell</h2><p>Ilovani ishga tushirishda xatolik yuz berdi.</p>'+details+'<button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div></main>';
  }
  function boot(){
    try{
      if(typeof init!=='function') throw new Error('BuySell init funksiyasi topilmadi');
      const app=document.getElementById('app');
      if(app && !app.innerHTML.trim()) init();
    }catch(e){
      console.error('BuySell bootstrap:',e);
      showError(e?.message||String(e));
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,120)});
  else setTimeout(boot,120);
  window.addEventListener('load',function(){setTimeout(boot,700)});
})();
</script>
</body>
</html>
