async function queryListings(){let q=sb.from('listings').select('id,title,price,negotiable,category,subcategory,condition,region,district,city,description,user_id,created_at,promotion').eq('status','active').order('created_at',{ascending:false}).limit(60);if(state.search){const term=safeSearch(state.search);if(term)q=q.or(`title.ilike.%${term}%,description.ilike.%${term}%`);}if(state.category)q=q.eq('category',state.category);if(state.subcategory)q=q.eq('subcategory',state.subcategory);if(state.region)q=q.eq('region',state.region);if(state.condition)q=q.eq('condition',state.condition);if(state.minPrice!==''&&Number.isFinite(Number(state.minPrice)))q=q.gte('price',Number(state.minPrice));if(state.maxPrice!==''&&Number.isFinite(Number(state.maxPrice)))q=q.lte('price',Number(state.maxPrice));if(state.sort==='price_asc')q=q.order('price',{ascending:true});else if(state.sort==='price_desc')q=q.order('price',{ascending:false});else if(state.sort==='views')q=q.order('views',{ascending:false});else q=q.order('created_at',{ascending:false});let {data,error}=await q;if(error){console.error('queryListings',error);toast('E’lonlarni yuklashda xatolik: '+error.message);return []}let ids=(data||[]).map(x=>x.id);if(!ids.length)return data||[];let {data:imgs,error:ie}=await sb.from('listing_images').select('listing_id,public_url,sort_order').in('listing_id',ids).order('sort_order');if(ie)console.error('listing_images',ie);let map={};(imgs||[]).forEach(x=>(map[x.listing_id]??=[]).push(x));return (data||[]).map(x=>({...x,listing_images:map[x.id]||[]}))}

async function searchPage(){if(!hasCondition(state.category))state.condition='';let ls=await queryListings();let subcats=state.category?(cats[state.category]||[]):[];return `<div class="head"><div><h2>E'lonlar</h2><div class="muted">${state.category?esc(state.category):'Barcha kategoriyalar'}${state.subcategory?' · '+esc(state.subcategory):''}</div></div><span class="muted">${ls.length} ta</span></div><div class="panel search-panel" style="margin-bottom:15px"><div class="form"><div><label class="label">Kalit so'z</label><input id="searchKeyword" class="input" placeholder="Masalan: iPhone, ish, mashina..." value="${esc(state.search)}" onkeydown="if(event.key==='Enter')applyFilters()"></div><div><label class="label">Kategoriya</label><select id="filterCat" class="select" onchange="state.category=this.value;state.subcategory='';route()"><option value="">Barchasi</option>${Object.keys(cats).map(c=>`<option value="${esc(c)}" ${state.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${state.category?`<div><label class="label">Subkategoriya</label><select id="filterSub" class="select" onchange="state.subcategory=this.value;route()"><option value="">Barcha ${esc(state.category)}</option>${subcats.map(c=>`<option value="${esc(c)}" ${state.subcategory===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}<div><label class="label">Hudud</label><select id="filterRegion" class="select"><option value="">Barcha hududlar</option>${regions.map(r=>`<option value="${esc(r)}" ${state.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>${state.category && hasCondition(state.category)?`<div><label class="label">Holati</label><select id="filterCondition" class="select"><option value="">Barchasi</option><option ${state.condition==='Yangi'?'selected':''}>Yangi</option><option ${state.condition==='Yaxshi'?'selected':''}>Yaxshi</option><option ${state.condition==="O'rtacha"?'selected':''}>O'rtacha</option><option ${state.condition==="Ta'mir talab"?'selected':''}>Ta'mir talab</option></select></div>`:''}<div><label class="label">Narx oralig‘i</label><div class="actions" style="gap:8px"><input id="minPrice" class="input" type="number" min="0" placeholder="dan" value="${esc(state.minPrice)}"><input id="maxPrice" class="input" type="number" min="0" placeholder="gacha" value="${esc(state.maxPrice)}"></div></div><div><label class="label">Saralash</label><select id="filterSort" class="select"><option value="new" ${state.sort==='new'?'selected':''}>Yangilari</option><option value="price_asc" ${state.sort==='price_asc'?'selected':''}>Arzonidan</option><option value="price_desc" ${state.sort==='price_desc'?'selected':''}>Qimmatidan</option><option value="views" ${state.sort==='views'?'selected':''}>Ko‘p ko‘rilgan</option></select></div><button class="btn primary" onclick="applyFilters()">Filtrlash</button><button class="btn" onclick="clearFilters()">Tozalash</button></div></div>${state.category?`<div class="subcat-strip"><div class="subcat-title">${esc(state.category)} bo‘limlari</div><div class="subcat-list"><button class="subcat-chip ${!state.subcategory?'selected':''}" onclick="state.subcategory='';route()">Barchasi</button>${subcats.map(c=>`<button class="subcat-chip ${state.subcategory===c?'selected':''}" onclick="state.subcategory='${esc(c)}';route()">${esc(c)}</button>`).join('')}</div></div>`:''}<div class="cards">${ls.length?ls.map(card).join(''):'<div class="panel">Mos e’lon topilmadi.</div>'}</div>`}
function applyFilters(){state.search=document.getElementById('searchKeyword')?.value.trim()||'';state.region=document.getElementById('filterRegion')?.value||'';state.condition=hasCondition(state.category)?(document.getElementById('filterCondition')?.value||''):'';state.minPrice=document.getElementById('minPrice')?.value||'';state.maxPrice=document.getElementById('maxPrice')?.value||'';state.sort=document.getElementById('filterSort')?.value||'new';route()}

"textarea" rows="7" required placeholder="Mahsulot holati, komplekt, yetkazib berish va boshqa ma'lumotlar"></textarea></div><div class="full"><label><input id="neg" type="checkbox"> Narx kelishiladi</label></div><div class="full actions"><button type="button" class="btn" onclick="aiAssist()">🤖 AI yordamchi</button><button type="submit" class="btn primary">E'lonni yuborish</button></div></form></div>`}

async function saveListing(e){e.preventDefault();const btn=e.submitter||document.querySelector('#lf button[type=submit]');const files=[...(document.getElementById('imgs')?.files||[])];if(files.length>10)return toast('10 tagacha rasm mumkin');for(const file of files){if(!file.type.startsWith('image/'))return toast('Faqat rasm fayllari mumkin');if(file.size>8*1024*1024)return toast('Har bir rasm 8 MB dan oshmasin')}if(btn){btn.disabled=true;btn.textContent='Yuklanmoqda...'}const row={user_id:state.user.id,title:document.getElementById('lt').value.trim(),category:document.getElementById('lc').value,subcategory:document.getElementById('ls').value,price:Number(document.getElementById('lp').value||0),condition:document.getElementById('lcond')?.value||null,description:document.getElementById('ldesc').value.trim(),region:document.getElementById('lr').value,district:document.getElementById('ld').value.trim(),phone:document.getElementById('lphone').value.trim(),negotiable:document.getElementById('neg').checked,status:'pending'};let {data,error}=await sb.from('listings').insert(row).select().single();if(error){if(btn){btn.disabled=false;btn.textContent='E’lonni yuborish'}return toast(error.message)}const uploaded=[];try{for(let i=0;i<files.length;i++){const file=files[i];const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${state.user.id}/${data.id}/${crypto.randomUUID()}-${safe}`;const up=await sb.storage.from('listing-images').upload(path,file,{upsert:false});if(up.error)throw new Error('Rasm yuklash xatosi: '+up.error.message);uploaded.push(path);const pub=sb.storage.from('listing-images').getPublicUrl(path).data.publicUrl;const ir=await sb.from('listing_images').insert({listing_id:data.id,path,public_url:pub,sort_order:i});if(ir.error)throw new Error('Rasm ma’lumotini saqlash xatosi: '+ir.error.message)}}catch(err){if(uploaded.length)await sb.storage.from('listing-images').remove(uploaded);await sb.from('listings').delete().eq('id',data.id).eq('user_id',state.user.id);if(btn){btn.disabled=false;btn.textContent='E’lonni yuborish'}return toast(err.message||'E’lonni saqlashda xatolik')}if(btn){btn.disabled=false;btn.textContent='E’lonni yuborish'}toast('E’lon yuborildi. Moderatsiyadan keyin ko‘rinadi.');go('#myads')}
async function item(id){if(!id)return '<div class="panel">E’lon topilmadi.</div>';const {data:l,error:le}=await sb.from('listings').select('id,title,price,negotiable,category,subcategory,condition,region,district,city,description,user_id,created_at,public_phone,status').eq('id',id).maybeSingle();if(le){console.error('Listing load error:',le);return `<div class="panel"><h3>E’lonni ochib bo‘lmadi</h3><p class="muted">${esc(le.message||'Noma’lum xatolik')}</p></div>`}if(!l)return '<div class="panel">E’lon topilmadi.</div>';const [{data:imgs,error:ie},{data:profile,error:pe}]=await Promise.all([sb.from('listing_images').select('public_url,sort_order').eq('listing_id',id).order('sort_order'),sb.from('profiles').select('name,avatar_url,rating,verified,created_at').eq('id',l.user_id).maybeSingle()]);if(ie)console.error('Image metadata load error:',ie);if(pe)console.error('Profile load error:',pe);const listImgs=(imgs||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)),im=listImgs[0]?.public_url;return `<div class="detail"><div><div class="gallery">${im?`<img id="mainGalleryImg" src="${esc(im)}" onerror="this.style.display='none';this.parentElement.classList.add('broken-img')">`:'📦'}</div>${listImgs.length>1?`<div class="actions" style="margin-top:8px;flex-wrap:wrap">${listImgs.map((x,i)=>`<button class="thumbbtn" onclick="document.getElementById('mainGalleryImg').src='${esc(x.public_url)}'"><img src="${esc(x.public_url)}" alt="${i+1}" style="width:70px;height:55px;object-fit:cover;border-radius:8px"></button>`).join('')}</div>`:''}</div><div class="panel"><span class="badge">${esc(l.status||'')}</span> <span class="badge">${esc(l.condition||'')}</span><h1>${esc(l.title)}</h1><div class="price" style="font-size:27px">${money(l.price)}</div><div class="meta">${esc(l.region||'')} · ${esc(l.city||l.district||'')} · ${new Date(l.created_at).toLocaleDateString('uz-UZ')}</div><p style="white-space:pre-wrap">${esc(l.description||'')}</p>${l.status==='pending'?'<div class="notice">⏳ E’loningiz moderatsiya kutilmoqda. Hozircha faqat sizning profilingizda ko‘rinadi.</div>':''}<div class="actions">${l.status==='active'?`<button class="btn primary" onclick="chatSeller('${l.id}','${l.user_id}')">💬 Chat</button>`:''}${l.public_phone?`<a class="btn" href="tel:${esc(l.public_phone)}">📞 Qo‘ng‘iroq</a>`:''}<button class="btn" onclick="fav('${l.id}')">♡ Sevimli</button>${l.status==='active'?`<button class="btn danger" onclick="report('${l.id}')">⚑ Shikoyat</button>`:''}</div><div class="seller"><div class="avatar">${esc((profile?.name||'S')[0])}</div><div><b>${esc(profile?.name||'Sotuvchi')}</b><div class="meta">⭐ ${profile?.rating||5.0} · profil</div></div></div></div></div>`}
async function fav(id){if(!state.user)return auth();let {data}=await sb.from('favorites').select('*').eq('user_id',state.user.id).eq('listing_id',id).maybeSingle();if(data){await sb.from('favorites').delete().eq('user_id',state.user.id).eq('listing_id',id);toast('Sevimlilardan olib tashlandi')}else{await sb.from('favorites').insert({user_id:state.user.id,listing_id:id});toast('Sevimlilarga saqlandi')}}
async function favorites(){if(!state.user)return `<div class="panel">Sevimlilar uchun hisobga kiring.</div>`;let {data,error}=await sb.from('favorites').select('listing_id').eq('user_id',state.user.id);if(error)return `<div class="panel">Sevimlilarni yuklashda xatolik: ${esc(error.message)}</div>`;let ids=(data||[]).map(x=>x.listing_id);if(!ids.length)return '<div class="panel">Sevimlilar bo‘sh.</div>';let {data:ls,error:e2}=await sb.from('listings').select('id,user_id,title,category,subcategory,price,negotiable,condition,description,region,city,district,contact_chat,contact_phone,public_phone,status,promotion,views,created_at,updated_at').in('id',ids).eq('status','active');if(e2)return `<div class="panel">E’lonlarni yuklashda xatolik: ${esc(e2.message)}</div>`;let {data:imgs}=await sb.from('listing_images').select('listing_id,public_url,sort_order').in('listing_id',ids).order('sort_order');let map={};(imgs||[]).forEach(x=>(map[x.listing_id]??=[]).push(x));(ls||[]).forEach(x=>x.listing_images=map[x.id]||[]);return `<div class="head"><h2>Sevimlilar</h2></div><div class="cards">${(ls||[]).map(card).join('')}</div>`}
async function myads(){if(!state.user)return '<div class="panel">Kirish kerak.</div>';let {data:ls}=await sb.from('listings').select('*').eq('user_id',state.user.id).order('created_at',{ascending:false});let ids=(ls||[]).map(x=>x.id);if(ids.length){let {data:imgs}=await sb.from('listing_images').select('listing_id,public_url,sort_order').in('listing_id',ids).order('sort_order');let map={};(imgs||[]).forEach(x=>(map[x.listing_id]??=[]).push(x));(ls||[]).forEach(x=>x.listing_images=map[x.id]||[])}return `<div class="head"><h2>Mening e’lonlarim</h2><button class="btn primary" onclick="go('#create')">+ Yangi</button></div><div class="panel"><table style="width:100%;border-collapse:collapse"><tbody>${(ls||[]).map(l=>`<tr><td style="padding:12px;border-bottom:1px solid var(--line)"><b>${esc(l.title)}</b><div class="meta">${esc(l.region||'')}</div></td><td>${money(l.price)}</td><td><span class="badge">${esc(l.status)}</span></td><td><button class="btn" onclick="go('#item/${l.id}')">Ko‘rish</button></td></tr>`).join('')||'<tr><td>Hali e’lon yo‘q.</td></tr>'}</tbody></table></div>`}
async function chatSeller(listingId,sellerId){if(!state.user)return auth();if(state.user.id===sellerId)return toast('O‘zingiz bilan chat ochib bo‘lmaydi');let {data:c,error}=await sb.from('conversations').select('*').eq('listing_id',listingId).eq('buyer_id',state.user.id).eq('seller_id',sellerId).maybeSingle();if(error)return toast(error.message);if(!c){let r=await sb.from('conversations').insert({listing_id:listingId,buyer_id:state.user.id,seller_id:sellerId}).select().single();if(r.error)return toast(r.error.message);c=r.data}state.conversation=c?.id;go('#messages')}
async function messages(){if(!state.user)return '<div class="panel">Xabarlar uchun hisobga kiring.</div>';let {data:cs,error}=await sb.from('conversations').select('*').or(`buyer_id.eq.${state.user.id},seller_id.eq.${state.user.id}`).order('created_at',{ascending:false});if(error){console.error(error);return `<div class="panel">Xabarlarni yuklashda xatolik: ${esc(error.message)}</div>`}cs=cs||[];let listingIds=[...new Set(cs.map(x=>x.listing_id).filter(Boolean))];let userIds=[...new Set(cs.flatMap(x=>[x.buyer_id,x.seller_id]).filter(Boolean))];let listings={},profiles={};if(listingIds.length){let {data:ls}=await sb.from('listings').select('id,title').in('id',listingIds);(ls||[]).forEach(x=>listings[x.id]=x)}if(userIds.length){let {data:ps}=await sb.from('profiles').select('id,name,avatar_url,verified').in('id',userIds);(ps||[]).forEach(x=>profiles[x.id]=x)}cs=cs.map(x=>({...x,listings:listings[x.listing_id]||null,other:profiles[x.buyer_id===state.user.id?x.seller_id:x.buyer_id]||null}));let c=cs.find(x=>x.id===state.conversation)||cs[0];if(!c){if(state.chatChannel){sb.removeChannel(state.chatChannel);state.chatChannel=null}return '<div class="panel">Hali suhbat yo‘q. E’lon sahifasidan Chat tugmasini bosing.</div>'}state.conversation=c.id;let {data:ms,error:me}=await sb.from('messages').select('*').eq('conversation_id',c.id).order('created_at');if(me)console.error(me);if(state.chatChannel){sb.removeChannel(state.chatChannel);state.chatChannel=null}state.chatChannel=sb.channel('chat:'+c.id,{config:{private:true}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+c.id},payload=>{if(payload.new.sender_id!==state.user.id)route()}).subscribe();return `<div class="panel chat"><div class="chatlist">${cs.map(x=>`<div class="chatitem ${x.id===c.id?'sel':''}" onclick="state.conversation='${x.id}';route()"><b>${esc(x.other?.name||'Foydalanuvchi')}</b><div class="meta">${esc(x.listings?.title||'E’lon')}</div></div>`).join('')}</div><div><div style="padding:12px;border-bottom:1px solid var(--line)"><b>${esc(c.other?.name||'Suhbat')}</b></div><div class="msgs" id="messagesBox">${(ms||[]).map(m=>`<div class="bubble ${m.sender_id===state.user.id?'me':''}">${esc(m.text)}</div>`).join('')}</div><div class="composer"><input id="ct" class="input" placeholder="Xabar yozing..." maxlength="2000" onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn primary" onclick="sendMsg()">Yuborish</button></div></div></div>`}
async function sendMsg(){let el=document.getElementById('ct'),t=el?.value.trim();if(!t||!state.conversation||!state.user)return;if(t.length>2000)return toast('Xabar 2000 belgidan oshmasin');let {error}=await sb.from('messages').insert({conversation_id:state.conversation,sender_id:state.user.id,text:t});if(error)toast(error.message);else{el.value='';route()}}
async function moderation(){if(!state.user||state.profile?.role!=='admin')return '<div class="panel"><h2>Ruxsat yo‘q</h2><p class="muted">Bu bo‘lim faqat administrator uchun.</p></div>';let [{data:ls,error:le},{data:rs,error:re}]=await Promise.all([sb.from('listings').select('*').order('created_at',{ascending:false}).limit(100),sb.from('reports').select('*').order('created_at',{ascending:false}).limit(100)]);if(le||re)return `<div class="panel">Moderatsiya ma’lumotlarini yuklashda xatolik.</div>`;let ids=[...(ls||[]).map(x=>x.id),...(rs||[]).map(x=>x.listing_id).filter(Boolean)];let imgs={};if(ids.length){let {data:is}=await sb.from('listing_images').select('listing_id,public_url,sort_order').in('listing_id',[...new Set(ids)]).order('sort_order');(is||[]).forEach(x=>{if(!imgs[x.listing_id])imgs[x.listing_id]=x.public_url})}return `<div class="head"><div><h2>Moderatsiya</h2><div class="muted">E’lonlar va shikoyatlarni boshqaring</div></div><button class="btn" onclick="route()">Yangilash</button></div><div class="panel"><h3>Shikoyatlar (${(rs||[]).filter(x=>x.status==='open').length} ochiq)</h3>${(rs||[]).map(r=>`<div class="moderow"><div><b>${esc(r.reason)}</b><div class="meta">E’lon: ${esc(r.listing_id||'—')} · ${new Date(r.created_at).toLocaleString('uz-UZ')}</div><div>${esc(r.details||'')}</div></div><div class="actions"><span class="badge">${esc(r.status)}</span>${r.status==='open'?`<button class="btn" onclick="moderateReport('${r.id}','resolved')">Yopish</button><button class="btn" onclick="moderateReport('${r.id}','dismissed')">Rad etish</button>`:''}</div></div>`).join('')||'<div class="muted">Shikoyatlar yo‘q.</div>'}</div><div class="panel"><h3>E’lonlar</h3>${(ls||[]).map(l=>`<div class="moderow"><div class="modthumb">${imgs[l.id]?`<img src="${esc(imgs[l.id])}">`:'📦'}</div><div class="modinfo"><b>${esc(l.title)}</b><div class="meta">${money(l.price)} · ${esc(l.category)} · ${esc(l.status)}</div></div><div class="actions"><button class="btn" onclick="go('#item/${l.id}')">Ko‘rish</button>${l.status!=='active'?`<button class="btn primary" onclick="setListingStatus('${l.id}','active')">Faollashtirish</button>`:''}${l.status!=='rejected'?`<button class="btn danger" onclick="setListingStatus('${l.id}','rejected')">Rad etish</button>`:''}</div></div>`).join('')||'<div class="muted">E’lonlar yo‘q.</div>'}</div>`}
async function setListingStatus(id,status){if(state.profile?.role!=='admin')return toast('Ruxsat yo‘q');let {error}=await sb.from('listings').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);toast(status==='active'?'E’lon faollashtirildi':'E’lon rad etildi');route()}
async function moderateReport(id,status){if(state.profile?.role!=='admin')return toast('Ruxsat yo‘q');let {error}=await sb.from('reports').update({status}).eq('id',id);if(error)return toast(error.message);toast('Shikoyat yangilandi');route()}
function report(id){if(!state.user)return auth();openModal(`<h2>Shikoyat</h2><select id="rr" class="select"><option>Shubhali / firibgarlik</option><option>Spam</option><option>Noto‘g‘ri kategoriya</option><option>Noqonuniy kontent</option></select><textarea id="rd" class="textarea" rows="4" style="margin-top:10px" placeholder="Izoh"></textarea><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="sendReport('${id}')">Yuborish</button><button class="btn" onclick="closeModal()">Bekor</button></div>`)}
async function sendReport(id){let {error}=await sb.from('reports').insert({reporter_id:state.user.id,listing_id:id,reason:document.getElementById('rr').value,details:document.getElementById('rd').value});if(error)toast(error.message);else{closeModal();toast('Shikoyat yuborildi')}}
async function route(){try{let h=location.hash||'#/';let body=h==='#/'?await home():h==='#categories'?categories():h.startsWith('#category/')?categoryPage(decodeURIComponent(h.slice(10))):h==='#search'?await searchPage():h==='#create'?await create():h==='#profile'?profile():h==='#myads'?await myads():h==='#favorites'?await favorites():h==='#messages'?await messages():h==='#moderation'?await moderation():h.startsWith('#item/')?await item(decodeURIComponent(h.slice(6))):home();document.getElementById('app').innerHTML=header()+`<main class="container">${body}</main>`+mobile()+`<footer class="footer">© 2026 BuySell · O‘zbekiston marketplace</footer>`;let f=document.getElementById('lf');if(f)f.addEventListener('submit',saveListing)}catch(e){console.error(e);document.getElementById('app').innerHTML=header()+`<main class="container"><div class="panel"><h2>BuySell</h2><p>Ilovani yuklashda xatolik yuz berdi.</p><p class="muted">${esc(e.message||e)}</p><button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div></main>`+mobile()}}function goBack(){let h=location.hash||'#/';if(h==='#/'||h===''){return} if(h.startsWith('#category/')){go('#categories');return} if(h==='#search' && state.category){go('#category/'+encodeURIComponent(state.category));return} if(document.referrer && history.length>1){history.back();}else go('#/')}
function go(h){location.hash=h}window.addEventListener('hashchange',route);init();
</script></body></html>
