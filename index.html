<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="OldiSotdi — O'zbekistonda oldi-sotdi marketplace">
<meta name="theme-color" content="#0f1117">
<title>OldiSotdi — Marketplace</title>
<link rel="stylesheet" href="./style.css?v=29">
<script>
try {
  const saved=localStorage.getItem('buysell-theme');
  document.documentElement.dataset.theme=saved==='light'?'light':'dark';
} catch(e) { document.documentElement.dataset.theme='dark'; }
window.__oldisotdiBootError=null;
window.addEventListener('error',function(e){
  window.__oldisotdiBootError={message:e.message||'JavaScript xatosi',source:e.filename||'',line:e.lineno||0,col:e.colno||0};
});
window.addEventListener('unhandledrejection',function(e){
  window.__oldisotdiBootError={message:String(e.reason?.message||e.reason||'Promise xatosi'),source:'unhandledrejection',line:0,col:0};
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"><main class="container"><div class="panel"><h2>OldiSotdi</h2><p>Yuklanmoqda…</p></div></main></div>
<div id="modal" class="modal hide"></div>
<div id="toast" class="toast hide"></div>
<script src="./app1.js?v=29"></script>
<script src="./app2.js?v=29"></script>
<script src="./app3.js?v=29"></script>
<script src="./app4.js?v=29"></script>
<script src="./app5.js?v=29"></script>
<script src="./app6.js?v=29"></script>
<script>
(function(){
  function showError(){
    const app=document.getElementById('app');
    if(!app)return;
    const e=window.__oldisotdiBootError;
    const details=e?'<pre style="white-space:pre-wrap;text-align:left;margin-top:12px;overflow:auto">'+String(e.message)+'\n'+String(e.source)+'\nline: '+e.line+' col: '+e.col+'</pre>':'';
    app.innerHTML='<main class="container"><div class="panel"><h2>OldiSotdi</h2><p>Ilovani ishga tushirishda xatolik yuz berdi.</p>'+details+'<button class="btn primary" onclick="location.reload()">Qayta yuklash</button></div></main>';
  }
  function loadTranslation(){
    if(document.getElementById('oldisotdi-translation'))return;
    const s=document.createElement('script');s.id='oldisotdi-translation';s.src='./app8.js?v=2';s.onerror=function(){console.warn('Translation layer failed to load')};document.body.appendChild(s);
  }
  async function boot(){
    try{
      if(typeof init!=='function')throw new Error('OldiSotdi init funksiyasi topilmadi');
      await init();
      setTimeout(loadTranslation,250);
    }catch(e){
      console.error('OldiSotdi bootstrap:',e);
      window.__oldisotdiBootError={message:e?.message||String(e),source:'bootstrap',line:0,col:0};
      showError();
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
  setTimeout(function(){
    const app=document.getElementById('app');
    if(app&&!app.innerHTML.trim())showError();
  },8000);
})();
</script>
</body>
</html>
